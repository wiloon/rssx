# The ONE place the rssx-ui image build tools are pinned. Homelab Tekton reads
# this file, so every build uses exactly the same builder and run image.
#
# Pinned by digest, not by tag: a tag can be moved to different content at any
# time, a digest cannot. To upgrade, look up the new digest of the tag in the
# comment and change it here only.

# heroku/builder:24 -- used only for its Ubuntu 24.04 build environment and the
# CNB lifecycle; its own buildpacks are not used (see cnb/vite-static).
RSSX_CNB_BUILDER_IMAGE=docker.io/heroku/builder@sha256:11868781e93774f24d017c56517e259ab3537fdc6379fc24a67d754bc27bcdf8

# paketobuildpacks/ubuntu-noble-run-tiny:latest -- Ubuntu 24.04, no shell,
# ~11 MB. The only runtime binary is static-web-server (statically linked).
RSSX_CNB_RUN_IMAGE=docker.io/paketobuildpacks/ubuntu-noble-run-tiny@sha256:23148caef914968a78ae046d7e89ee380741a2a14cb247d41fd1edb74a3bddf3
