# pnpm 10+ requires an explicit build-script decision for every dependency that
# ships a postinstall; an unresolved one fails `pnpm install` with
# ERR_PNPM_IGNORED_BUILDS. The Vite + Vitest toolchain needs exactly two:
#   - esbuild  : unpacks its platform binary
#   - vue-demi : picks the Vue 2/3 shim at install time
onlyBuiltDependencies:
  - esbuild
  - vue-demi
