version: '3'

tasks:
  default:
    cmds:
      - task --list

  api:run:
    desc: 启动 RSSX API 服务
    dir: rssx-api
    cmds:
      - go run rssx-api.go

  api:stop:
    desc: 停止 RSSX API 服务
    cmds:
      - lsof -ti :8080 | xargs kill -9 2>/dev/null || echo "No API process running on port 8080"

  api:reset-password:
    desc: "重置用户密码 (用法: task api:reset-password USER=用户名 PASSWORD=密码)"
    dir: rssx-api
    cmds:
      - task reset-password USER={{.USER}} PASSWORD={{.PASSWORD}}

  ui:install:
    desc: 安装 UI 依赖（使用 pnpm + fnm）
    dir: rssx-ui
    cmds:
      - fnm exec --using=18 pnpm install

  ui:run:
    desc: 启动 RSSX UI 开发服务器
    dir: rssx-ui
    cmds:
      - fnm exec --using=18 pnpm serve

  deploy:api:
    desc: 触发 Tekton Pipeline 构建并部署 rssx-api
    cmds:
      - kubectl create -f ~/workspace/w10n-config/homelab/k8s/tekton/pipelinerun-rssx-api.yaml

  deploy:api:logs:
    desc: 查看最新一次 rssx-api 构建日志
    cmds:
      - tkn pipelinerun logs -n tekton-pipelines -f --last

  deploy:ui:
    desc: 触发 Tekton Pipeline 构建并部署 rssx-ui
    cmds:
      - kubectl create -f ~/workspace/w10n-config/homelab/k8s/tekton/pipelinerun-rssx-ui.yaml
