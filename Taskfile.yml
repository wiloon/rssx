version: '3'

vars:
  # ROOT_DIR follows the invocation path; resolve symlinks so ../w10n-config
  # points at the sibling checkout.
  RSSX_REAL_DIR:
    sh: realpath '{{.ROOT_DIR}}'
  W10N_HOMELAB: '{{.RSSX_REAL_DIR}}/../w10n-config/infra/homelab'
  CURRENT_BRANCH:
    sh: git -C '{{.ROOT_DIR}}' rev-parse --abbrev-ref HEAD

tasks:
  default:
    cmds:
      - task --list

  api:run:
    desc: 启动 RSSX API 服务
    dir: rssx-api
    cmds:
      - go run rssx-api.go

  api:stop:
    desc: 停止 RSSX API 服务
    cmds:
      - lsof -ti :8080 | xargs kill -9 2>/dev/null || echo "No API process running on port 8080"

  api:reset-password:
    desc: "重置用户密码 (用法: task api:reset-password USER=用户名 PASSWORD=密码)"
    dir: rssx-api
    cmds:
      - task reset-password USER={{.USER}} PASSWORD={{.PASSWORD}}

  ui:install:
    desc: 安装 UI 依赖（使用 pnpm + fnm）
    dir: rssx-ui
    cmds:
      - fnm exec --using=18 pnpm install

  ui:run:
    desc: 启动 RSSX UI 开发服务器
    dir: rssx-ui
    cmds:
      - fnm exec --using=18 pnpm serve

  deploy:homelab:
    desc: "Build+deploy the CURRENT branch's api & ui to homelab via Tekton + ArgoCD; skips a service the cluster already runs. REV=<branch|tag>, FORCE=true to rebuild anyway"
    dir: '{{.W10N_HOMELAB}}'
    cmds:
      - task tekton-deploy-rssx SERVICE=both REV={{.REV | default .CURRENT_BRANCH}} FORCE={{.FORCE | default "false"}} RSSX_DIR={{.RSSX_REAL_DIR}}

  deploy:homelab:api:
    desc: "Build+deploy ONLY the CURRENT branch's api to homelab; skips if the cluster already runs it. REV=<branch|tag>, FORCE=true to rebuild anyway"
    dir: '{{.W10N_HOMELAB}}'
    cmds:
      - task tekton-deploy-rssx SERVICE=api REV={{.REV | default .CURRENT_BRANCH}} FORCE={{.FORCE | default "false"}} RSSX_DIR={{.RSSX_REAL_DIR}}

  deploy:homelab:ui:
    desc: "Build+deploy ONLY the CURRENT branch's ui to homelab; skips if the cluster already runs it. REV=<branch|tag>, FORCE=true to rebuild anyway"
    dir: '{{.W10N_HOMELAB}}'
    cmds:
      - task tekton-deploy-rssx SERVICE=ui REV={{.REV | default .CURRENT_BRANCH}} FORCE={{.FORCE | default "false"}} RSSX_DIR={{.RSSX_REAL_DIR}}

  deploy:logs:
    desc: 查看最新一次 Tekton 构建日志
    cmds:
      - tkn pipelinerun logs -n tekton-pipelines -f --last
