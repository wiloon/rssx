[rssx]
rss-sync-auto=true
# JWT signing key is RSSX_SECURITY_KEY. The server refuses to start when it is empty.

[redis]
# 本地开发用的地址。集群内部署时用 REDIS_ADDRESS 环境变量覆盖为
# k8s Service 域名，例如 redis.<namespace>.svc.cluster.local:6379
address="redis.wiloon.com:32379"

[sync]
# minute
duration=60

[news]
expire-time="-720h"
gc-duration="24h"

[log]
level="info"
path="/data/rssx/logs/"
file-name="rssx.log"
